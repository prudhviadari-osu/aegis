<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis · Jobs</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/jobs.css">
</head>
<body>
  <header>
    <h1>Aegis</h1>
    <nav><a href="/">Dashboard</a> · <span>Jobs</span></nav>
    <span id="tier-pill" class="pill pill-unknown">tier —</span>
  </header>

  <main class="jobs-layout">
    <section class="card job-table-card">
      <div id="no-model-banner" class="warn-banner" style="display:none"></div>
      <h2>Your matches <span id="job-count" class="muted"></span></h2>
      <p class="muted">Ranked best-first. Review each (Apply / Skip); the next tier
        unlocks when you've cleared this one.</p>
      <table id="job-table">
        <thead>
          <tr><th>Fit</th><th>Ring</th><th>Role</th><th>Company</th><th>Status</th></tr>
        </thead>
        <tbody id="job-rows">
          <tr><td colspan="5" class="muted">No scored jobs yet. Run a job_finder task on the dashboard.</td></tr>
        </tbody>
      </table>
    </section>

    <section class="card job-detail-card" id="detail">
      <p class="muted">Select a job to see the match breakdown.</p>
    </section>
  </main>

  <script src="/static/jobs.js"></script>
</body>
</html>
