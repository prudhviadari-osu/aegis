[project]
name = "aegis"
version = "0.1.0"
description = "Local-first personal AI agent platform (macOS, Apple Silicon)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
